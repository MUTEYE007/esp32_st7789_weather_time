<style>
  :root {
    --card-w: 220px;
    --card-h: 220px;
  }
  * { margin:0; padding:0; box-sizing:border-box; }
  body {
    background: #1a1a2e;

    font-family: 'Noto Sans SC', sans-serif;
    min-height: 100vh;
    overflow-x: hidden;
  }
  .bg-shapes {
    position: fixed; inset:0; pointer-events:none; z-index:0;
    background: radial-gradient(ellipse at 20% 20%, #16213e 0%, transparent 60%),
                radial-gradient(ellipse at 80% 80%, #0f3460 0%, transparent 60%);
  }
  .container { position:relative; z-index:1; max-width:1300px; margin:0 auto; padding:40px 20px; }
  
  header { text-align:center; margin-bottom:50px; }
  header h1 {
    font-family: 'Noto Serif SC', serif;
    font-size: 2.4rem; font-weight:900;
    background: linear-gradient(135deg, #f7971e, #ffd200);
    -webkit-background-clip:text; -webkit-text-fill-color:transparent;
    letter-spacing:0.04em;
  }
  header p { color:#889; margin-top:10px; font-size:0.95rem; letter-spacing:0.1em; }

  .grid { display:flex; flex-wrap:wrap; justify-content:center; gap:36px; }

  .card {
    background: #252540;
    border-radius:20px; padding:28px 22px 22px;
    display:flex; flex-direction:column; align-items:center;
    transition: transform 0.35s cubic-bezier(0.16,1,0.3,1), box-shadow 0.35s;
    border:1px solid #333355;
    box-shadow: 0 8px 32px rgba(0,0,0,0.3);
  }
  .card:hover {
    transform: translateY(-6px);
    box-shadow: 0 20px 48px rgba(0,0,0,0.45);
  }
  .card-title {
    font-family: 'Noto Serif SC', serif;
    font-size:1.1rem; font-weight:700; margin-bottom:4px; color:#ccc;
  }
  .card-subtitle { font-size:0.75rem; color:#777; margin-bottom:18px; }

  /* Screen mockup */
  .screen {
    width: var(--card-w); height: var(--card-h);
    border-radius:12px; overflow:hidden;
    position:relative;
    box-shadow: 0 0 0 3px #333, 0 0 0 6px #222, 0 12px 36px rgba(0,0,0,0.5);
    font-family: 'Noto Sans SC', 'Noto Serif SC', monospace;
    font-size:11px;
  }

  /* Status bar */
  .screen .status { display:flex; justify-content:space-between; align-items:center; padding:3px 8px; height:16px; gap:4px; }
  .screen .status .city { font-weight:600; font-size:10px; white-space:nowrap; }
  .screen .status .wifi { display:flex; gap:1.5px; margin-left:auto; margin-right:6px; }
  .screen .status .wifi-bar { width:3px; border-radius:1px; }
  .screen .status .stime { font-size:9px; white-space:nowrap; }

  /* Weather section */
  .screen .weather { display:flex; align-items:center; padding:4px 8px; height:34px; position:relative; }
  .screen .weather .icon { width:28px; height:28px; border-radius:50%; flex-shrink:0; position:relative; }
  .screen .weather .icon .rays { position:absolute; }
  .screen .weather .temp { font-size:24px; font-weight:900; margin-left:8px; line-height:1; }
  .screen .weather .temp .degree { font-size:10px; font-weight:400; vertical-align:super; margin-left:1px; }
  .screen .weather .hilo { position:absolute; right:8px; top:4px; font-size:9px; text-align:right; line-height:1.4; }

  /* Divider */
  .screen .divider { height:1px; margin:0 8px; }

  /* Clock */
  .screen .clock { text-align:center; padding:8px 0 2px; font-size:32px; font-weight:900; letter-spacing:2px; }
  .screen .clock .sec { font-size:13px; font-weight:400; margin-left:2px; }
  .screen .date { text-align:center; font-size:11px; padding-bottom:6px; }

  /* Detail */
  .screen .details { display:grid; grid-template-columns:1fr 1fr; gap:2px 8px; padding:3px 8px; font-size:9px; }
  .screen .details .dval { font-weight:600; }

  /* Chart */
  .screen .chart { padding:4px 8px; position:relative; height:32px; }
  .screen .chart svg { width:100%; height:100%; }

  /* Bottom bar */
  .screen .bottombar { height:2px; margin:0 8px; margin-top:4px; }

  .color-pills { display:flex; gap:5px; margin-top:14px; flex-wrap:wrap; justify-content:center; }
  .color-pills .pill {
    width:18px; height:18px; border-radius:50%;
    border:2px solid #444; cursor:default;
    position:relative; transition:transform 0.2s;
  }
  .color-pills .pill:hover { transform:scale(1.4); z-index:2; }
  .color-pills .pill::after {
    content:attr(data-label);
    position:absolute; bottom:calc(100% + 4px); left:50%; transform:translateX(-50%);
    background:#111; color:#ccc; font-size:9px; white-space:nowrap;
    padding:2px 6px; border-radius:3px;
    pointer-events:none; opacity:0; transition:opacity 0.2s;
  }
  .color-pills .pill:hover::after { opacity:1; }

  .rgb565 { margin-top:10px; font-size:9px; color:#666; text-align:center; }
  .rgb565 span { display:inline-block; margin:0 3px; }

  footer { text-align:center; margin-top:50px; color:#556; font-size:0.8rem; }

function hslToHex(h, s, l) {
  s /= 100; l /= 100;
  const k = n => (n + h / 30) % 12;
  const a = s * Math.min(l, 1 - l);
  const f = n => l - a * Math.max(-1, Math.min(k(n) - 3, Math.min(9 - k(n), 1)));
  const toHex = x => { const v = Math.round(255 * f(x)); return v.toString(16).padStart(2,'0'); };
  return '#' + toHex(0) + toHex(8) + toHex(4);
}

function hexToRgb565(hex) {
  const r = parseInt(hex.slice(1,3), 16);
  const g = parseInt(hex.slice(3,5), 16);
  const b = parseInt(hex.slice(5,7), 16);
  return '0x' + ((((r>>3)&0x1F)<<11) | (((g>>2)&0x3F)<<5) | ((b>>3)&0x1F)).toString(16).toUpperCase().padStart(4,'0');
}
